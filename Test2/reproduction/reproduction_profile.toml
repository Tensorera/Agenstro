name = "test2_reproduction"

[adapter]
executable = "opencode"
model = "zhipuai-coding-plan/glm-5.2"
agent = "build"
output_format = "json"
pure = true
auto_approve = true
inherit_environment = false
required_env = []
extra_args = []

[runtime]
max_concurrency = 3
max_attempts = 2
retry_backoff_seconds = 0
fail_fast = false
max_subagent_depth = 1
max_fan_out = 16
session_reuse = "never"

[workspace]
root = "../.reproduction-workspace-placeholder"
read_roots = []

[storage]
state_root = "../.reproduction-state-placeholder"
cas_dir = "cas"
traces_dir = "traces"
cache_dir = "cache"
manifests_dir = "manifests"
cache_enabled = false
fsync = false

[labels]
purpose = "blind paper supplementary reconstruction"
context_policy = "verified artifacts and fresh session per TaskRun"

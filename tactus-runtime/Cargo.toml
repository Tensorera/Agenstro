[package]
name = "tactus-runtime"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed, project-local runtime for Agenstro workflow plugins."
publish = false

[dependencies]
clap.workspace = true
command-group.workspace = true
ctrlc.workspace = true
dunce.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[[bin]]
name = "tactus"
path = "src/main.rs"

[[bin]]
name = "tactus-plugin-fixture"
path = "tests-rust/fixture.rs"
test = false
bench = false

[[test]]
name = "runtime"
path = "tests-rust/runtime.rs"

[[test]]
name = "adapters"
path = "tests-rust/adapters.rs"

[lints]
workspace = true

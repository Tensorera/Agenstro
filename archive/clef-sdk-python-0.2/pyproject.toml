[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "clef-sdk"
dynamic = ["version"]
description = "Frozen Clef 0.2 Python builders and RPC client."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "grpcio>=1.68,<2",
  "protobuf>=5.29,<7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Tensorera/agenstro"
Issues = "https://github.com/Tensorera/agenstro/issues"

[project.optional-dependencies]
dev = [
  "mkdocs>=1.6,<2",
  "pytest>=8.3,<10",
  "pyright>=1.1.400,<2",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clef_sdk", "src/clef_adapter_host"]

[tool.hatch.version]
path = "src/clef_sdk/__init__.py"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "N",
  "PIE",
  "SIM",
  "RUF",
  "D",
]
ignore = [
  "D105",
  "D107",
  "D203",
  "D213",
  # Keep compatibility with the public v1 exception name.
  "N818",
  # These migrations alter runtime types or public typing syntax; handle them
  # in a dedicated compatibility release instead of a formatter pass.
  "UP040",
  "UP042",
  "UP046",
  "UP047",
]
allowed-confusables = ["，", "；", "："]

[tool.ruff.lint.per-file-ignores]
"src/clef_sdk/__init__.py" = ["F403"]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Public dataclasses validate runtime callers in addition to static callers.
reportUnnecessaryIsInstance = "none"
reportUnnecessaryTypeIgnoreComment = "error"

[workspace]
resolver = "3"
members = [
  "tactus-runtime",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/Tensorera/Agenstro"

[workspace.dependencies]
clap = { version = "=4.5.60", features = ["derive"] }
command-group = { version = "=5.0.1", default-features = false }
ctrlc = { version = "=3.5.2", features = ["termination"] }
dunce = "=1.0.5"
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
nix = { version = "=0.27.1", default-features = false, features = ["process", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = { version = "=0.10.9", default-features = false }
tempfile = "=3.27.0"
thiserror = { version = "=2.0.19", default-features = false, features = ["std"] }
toml = "=0.9.11"
winreg = "=0.56.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

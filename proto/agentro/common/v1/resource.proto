syntax = "proto3";

package agentro.common.v1;

// Digest is an algorithm-tagged content digest.
message Digest {
  // algorithm is the lower-case algorithm name, initially sha256.
  string algorithm = 1;
  // value contains the raw digest bytes, never base64 text.
  bytes value = 2;
}

// ApiVersion identifies one additive API major and minor version.
message ApiVersion {
  // major changes only for a breaking API package revision.
  uint32 major = 1;
  // minor advances for compatible additions.
  uint32 minor = 2;
}

// ApiVersionRange states the compatible minor range within one API major.
message ApiVersionRange {
  // minimum is the oldest compatible API version.
  ApiVersion minimum = 1;
  // maximum is the newest compatible API version.
  ApiVersion maximum = 2;
}

syntax = "proto3";

package agentro.common.v1;

// ErrorDomain identifies the authority that classified an error.
enum ErrorDomain {
  // ERROR_DOMAIN_UNSPECIFIED is invalid at a validated boundary.
  ERROR_DOMAIN_UNSPECIFIED = 0;
  // ERROR_DOMAIN_AGENT covers normalized agent orchestration failures.
  ERROR_DOMAIN_AGENT = 1;
  // ERROR_DOMAIN_PROCESS covers supervised process failures.
  ERROR_DOMAIN_PROCESS = 2;
  // ERROR_DOMAIN_KERNEL covers Python or Jupyter kernel failures.
  ERROR_DOMAIN_KERNEL = 3;
  // ERROR_DOMAIN_CHECKPOINT covers workspace checkpoint failures.
  ERROR_DOMAIN_CHECKPOINT = 4;
  // ERROR_DOMAIN_STORAGE covers durable storage failures.
  ERROR_DOMAIN_STORAGE = 5;
  // ERROR_DOMAIN_SCHEDULER covers occurrence and dispatch failures.
  ERROR_DOMAIN_SCHEDULER = 6;
  // ERROR_DOMAIN_CONFIG covers configuration failures.
  ERROR_DOMAIN_CONFIG = 7;
  // ERROR_DOMAIN_PROTOCOL covers incompatible or malformed protocol data.
  ERROR_DOMAIN_PROTOCOL = 8;
  // ERROR_DOMAIN_RESOURCE covers bounded-resource failures.
  ERROR_DOMAIN_RESOURCE = 9;
}

// RetryAdvice tells a client which class of retry, if any, is safe.
enum RetryAdvice {
  // RETRY_ADVICE_UNSPECIFIED is invalid at a validated boundary.
  RETRY_ADVICE_UNSPECIFIED = 0;
  // RETRY_ADVICE_NEVER means automatic retry is not safe.
  RETRY_ADVICE_NEVER = 1;
  // RETRY_ADVICE_AFTER_BACKOFF permits a bounded, idempotent retry.
  RETRY_ADVICE_AFTER_BACKOFF = 2;
  // RETRY_ADVICE_AFTER_USER_ACTION requires an explicit user correction.
  RETRY_ADVICE_AFTER_USER_ACTION = 3;
}

// ErrorDetail carries stable machine fields for a gRPC status detail.
message ErrorDetail {
  // domain identifies the authority that classified the error.
  ErrorDomain domain = 1;
  // code is an upper-case stable machine code, not a display message.
  string code = 2;
  // retry gives typed retry guidance.
  RetryAdvice retry = 3;
  // trace_id is an opaque UUIDv7 used to locate bounded diagnostics.
  string trace_id = 4;
}

syntax = "proto3";

package agentro.common.v1;

// CapabilityStability describes whether a negotiated capability is stable.
enum CapabilityStability {
  // CAPABILITY_STABILITY_UNSPECIFIED is invalid at a validated boundary.
  CAPABILITY_STABILITY_UNSPECIFIED = 0;
  // CAPABILITY_STABILITY_STABLE is part of the supported contract.
  CAPABILITY_STABILITY_STABLE = 1;
  // CAPABILITY_STABILITY_EXPERIMENTAL may change outside the stable surface.
  CAPABILITY_STABILITY_EXPERIMENTAL = 2;
}

// Capability is one bounded, namespaced feature reported by a daemon.
message Capability {
  // name is a lower-case, dot-separated capability identifier.
  string name = 1;
  // stability states whether the capability is stable or experimental.
  CapabilityStability stability = 2;
}

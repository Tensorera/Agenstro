syntax = "proto3";

package agentro.schedule.v1;

import "google/protobuf/timestamp.proto";

// ScheduleService exposes bounded Segno schedule pages.
service ScheduleService {
  // ListSchedules returns one stable bounded schedule page.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
}

// ScheduleState is the externally visible schedule lifecycle.
enum ScheduleState {
  // SCHEDULE_STATE_UNSPECIFIED is invalid at a validated boundary.
  SCHEDULE_STATE_UNSPECIFIED = 0;
  // SCHEDULE_STATE_DISABLED does not create occurrences.
  SCHEDULE_STATE_DISABLED = 1;
  // SCHEDULE_STATE_READY may create or dispatch occurrences.
  SCHEDULE_STATE_READY = 2;
  // SCHEDULE_STATE_DISPATCHING owns an active dispatch lease.
  SCHEDULE_STATE_DISPATCHING = 3;
  // SCHEDULE_STATE_RECOVERY_REQUIRED needs reconciliation.
  SCHEDULE_STATE_RECOVERY_REQUIRED = 4;
}

// Schedule is a bounded schedule summary.
message Schedule {
  // schedule_id is an opaque schedule identifier.
  string schedule_id = 1;
  // task_id identifies the immutable task family.
  string task_id = 2;
  // label is bounded display text.
  string label = 3;
  // cron is the normalized five-field expression.
  string cron = 4;
  // timezone is the explicit IANA timezone identifier.
  string timezone = 5;
  // state is the current schedule lifecycle.
  ScheduleState state = 6;
  // next_fire_at is the next selected UTC instant when enabled.
  optional google.protobuf.Timestamp next_fire_at = 7;
  // last_run_id is the latest orchestration reference when available.
  optional string last_run_id = 8;
}

// ListSchedulesRequest selects one bounded stable page.
message ListSchedulesRequest {
  // page_size is constrained by the service endpoint.
  uint32 page_size = 1;
  // cursor is opaque and absent for the first page.
  optional string cursor = 2;
}

// ListSchedulesResponse contains one bounded page.
message ListSchedulesResponse {
  // schedules are returned in stable service-defined order.
  repeated Schedule schedules = 1;
  // next_cursor is absent when no later page exists.
  optional string next_cursor = 2;
}

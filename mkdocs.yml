site_name: Agenstro 0.3
site_description: Clef and Segno Haskell DSLs with the Tactus Rust runtime
repo_name: Tensorera/agenstro
repo_url: https://github.com/Tensorera/agenstro
docs_dir: docs
site_dir: Build/site
strict: true

theme:
  name: readthedocs

markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
    absolute_links: relative_to_docs

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Segno persistent tasks: segno.md
  - Motivo Studio: motivo-studio.md
  - Reference:
      - Local plugin protocol v1: reference/plugin-protocol-v1.md
      - CLI reference: reference/cli-v0.3.md
      - Segno plugin wire v1: reference/segno-plugin-wire-v1.md
      - Studio control API v1: reference/studio-control-v1.md
      - Support matrix: reference/support-matrix.md
  - Operations:
      - Troubleshooting: troubleshooting.md
  - Contributing:
      - Writing documentation: how-to/write-documentation.md
  - Project direction: roadmap.md
  - Decisions:
      - ADR 0003 - Haskell DSL and local plugins: adr/0003-haskell-dsl-and-local-plugins.md
      - ADR 0004 - Haskell Segno persistent tasks: adr/0004-haskell-segno-persistent-tasks.md
  - Migration:
      - 0.2 to Haskell 0.3: migrations/0.2-to-haskell-0.3.md

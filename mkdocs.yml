site_name: Agenstro 0.3
site_description: Typed coding-agent workflows with Clef, Tactus, Segno, and Motivo Studio
repo_name: Tensorera/Agenstro
repo_url: https://github.com/Tensorera/Agenstro
docs_dir: docs
site_dir: Build/site
strict: true

theme:
  name: readthedocs

markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
    absolute_links: relative_to_docs

nav:
  - Home: index.md
  - Start here:
      - Installation: install.md
      - First workflow: getting-started.md
      - Provider setup: providers.md
  - Develop:
      - Clef workflow guide: clef.md
      - Tactus workspace and configuration: tactus-workspace.md
      - Plugin authoring: plugin-authoring.md
      - Segno persistent tasks: segno.md
      - Motivo Studio: motivo-studio.md
  - Operate:
      - Logs and run evidence: observability.md
      - Workspace operations: operations.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Local plugin protocol v1: reference/plugin-protocol-v1.md
      - Norm catalogue v1: reference/norm-v1.md
      - CLI reference: reference/cli-v0.3.md
      - Segno plugin wire v1: reference/segno-plugin-wire-v1.md
      - Studio control API v1: reference/studio-control-v1.md
      - Session control API v1: reference/session-control-v1.md
      - Support matrix: reference/support-matrix.md
      - Glossary: reference/glossary.md
  - Project:
      - Architecture: architecture.md
      - Public roadmap: roadmap.md
      - Decisions:
          - ADR 0003 - Haskell DSL and local plugins: adr/0003-haskell-dsl-and-local-plugins.md
          - ADR 0004 - Haskell Segno persistent tasks: adr/0004-haskell-segno-persistent-tasks.md
          - ADR 0005 - Typed norms and refinement: adr/0005-norms-rubrics-and-refinement.md
          - ADR 0006 - Durable session boundary: adr/0006-motivo-session-pattern.md
          - ADR 0007 - Motivo task method: adr/0007-motivo-task-method.md
      - Design bundle implementation status: design-bundle-status.md
      - Migration:
          - 0.2 to Haskell 0.3: migrations/0.2-to-haskell-0.3.md
      - Writing documentation: how-to/write-documentation.md

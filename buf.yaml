version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # The frozen 0.2 wire contract predates Buf's per-RPC wrapper convention.
  # Renaming these responses would change generated Rust/TypeScript APIs; keep
  # every other STANDARD rule active while the legacy protocol remains frozen.
  ignore_only:
    RPC_REQUEST_RESPONSE_UNIQUE:
      - proto/agentro/execution/v1/run_service.proto
      - proto/agentro/workspace/v1/workspace_service.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/agentro/execution/v1/run_service.proto
      - proto/agentro/workspace/v1/workspace_service.proto
breaking:
  use:
    - FILE

name: Retained Rust foundation and Tactus

on:
  pull_request:
    paths:
      - ".github/workflows/rust-foundation.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "buf.yaml"
      - "crates/**"
      - "fixtures/**"
      - "proto/**"
      - "rust-toolchain.toml"
      - "tactus-runtime/**"
  push:
    paths:
      - ".github/workflows/rust-foundation.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "buf.yaml"
      - "crates/**"
      - "fixtures/**"
      - "proto/**"
      - "rust-toolchain.toml"
      - "tactus-runtime/**"

permissions:
  contents: read

jobs:
  rust:
    name: Rust stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: target/ci-rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Check all targets
        run: cargo +stable check --workspace --all-targets --all-features --locked
      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo +stable test --workspace --all-features --locked
      - name: Build documentation
        run: cargo +stable doc --workspace --all-features --no-deps --locked --document-private-items
      - name: Remove Rust build artifacts
        if: always()
        run: cargo clean --target-dir "${{ env.CARGO_TARGET_DIR }}"
      # Clef and Segno have their own Haskell workflow. This job covers the
      # current Rust Tactus kernel together with the retained foundation.

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: target/ci-msrv
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install MSRV
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check workspace at MSRV
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked
      - name: Test workspace at MSRV
        run: cargo +1.88.0 test --workspace --all-features --locked
      - name: Remove Rust build artifacts
        if: always()
        run: cargo clean --target-dir "${{ env.CARGO_TARGET_DIR }}"

  proto:
    name: Protobuf lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.72.0"
      - name: Check Protobuf formatting
        run: buf format --diff --exit-code
      - name: Lint Protobuf
        run: buf lint

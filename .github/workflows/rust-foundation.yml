name: Legacy Rust 0.2 foundation

on:
  pull_request:
    paths:
      - ".github/workflows/rust-foundation.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "buf.yaml"
      - "clef-sdk/rust/**"
      - "crates/**"
      - "fixtures/**"
      - "proto/**"
      - "rust-toolchain.toml"
      - "segno-flow/rust/**"
      - "tactus-runtime/rust/**"
  push:
    paths:
      - ".github/workflows/rust-foundation.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "buf.yaml"
      - "clef-sdk/rust/**"
      - "crates/**"
      - "fixtures/**"
      - "proto/**"
      - "rust-toolchain.toml"
      - "segno-flow/rust/**"
      - "tactus-runtime/rust/**"

permissions:
  contents: read

jobs:
  rust:
    name: Rust stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Check all targets
        run: cargo +stable check --workspace --all-targets --all-features --locked
      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo +stable test --workspace --all-features --locked
      - name: Build documentation
        run: cargo +stable doc --workspace --all-features --no-deps --locked --document-private-items
      # The Python identity/fixture scripts belonged to the superseded 0.2
      # Clef/Tactus packages. Rust contract and cross-language fixture behavior
      # remain covered by the workspace's native tests; the Haskell/Tactus 0.3
      # release surface has its own workflow.

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install MSRV
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check workspace at MSRV
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked
      - name: Test workspace at MSRV
        run: cargo +1.88.0 test --workspace --all-features --locked

  proto:
    name: Protobuf lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.72.0"
      - name: Check Protobuf formatting
        run: buf format --diff --exit-code
      - name: Lint Protobuf
        run: buf lint

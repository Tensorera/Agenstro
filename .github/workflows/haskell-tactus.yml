name: Clef, Tactus, and Segno 0.3

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  tactus-rust:
    name: Tactus Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TARGET_DIR: Build/ci-tactus
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Check the Rust workspace
        run: cargo +stable check --workspace --all-targets --locked
      - name: Lint the Rust workspace
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Tactus without model calls
        run: cargo +stable test -p tactus-runtime --locked
      - name: Test the topology reference program
        run: cargo +stable test --manifest-path examples/topology-holes/reference/Cargo.toml --locked
      - name: Remove Rust build artifacts
        if: always()
        run: cargo clean --target-dir "${{ env.CARGO_TARGET_DIR }}"

  tactus-msrv:
    name: Tactus Rust 1.88 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: Build/ci-tactus-msrv
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install MSRV
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check Tactus at MSRV
        run: cargo +1.88.0 check --workspace --all-targets --locked
      - name: Test Tactus at MSRV
        run: cargo +1.88.0 test -p tactus-runtime --locked
      - name: Remove Rust build artifacts
        if: always()
        run: cargo clean --target-dir "${{ env.CARGO_TARGET_DIR }}"

  clef-haskell:
    name: Clef and Segno Haskell (${{ matrix.os }}, GHC ${{ matrix.ghc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: "9.10.3"
            cabal: "3.16.1.0"
          - os: windows-latest
            ghc: "9.10.3"
            cabal: "3.16.1.0"
          - os: ubuntu-latest
            ghc: "9.14.1"
            cabal: "3.18.1.0"
    env:
      CARGO_TARGET_DIR: Build/ci-tactus-e2e
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@bda9c527d4136f7759733016190c34a24c84f4f4 # v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build Tactus and the optional experiment plugin
        run: cargo +stable build --workspace --locked
      - name: Put Tactus on PATH
        shell: bash
        run: echo "$CARGO_TARGET_DIR/debug" >> "$GITHUB_PATH"
      - name: Update Hackage index
        run: cabal update
      - name: Build Clef and Segno
        run: cabal build --builddir=Build/cabal all --enable-tests --ghc-options=-Werror
      - name: Test Clef with fake streaming plugins
        run: cabal test --builddir=Build/cabal clef-sdk:test:clef-sdk-tests --test-show-details=direct --ghc-options=-Werror
      - name: Test Segno with virtual time and fake process boundaries
        run: cabal test --builddir=Build/cabal segno-flow:test:segno-flow-tests --test-show-details=direct --ghc-options=-Werror
      - name: Exercise installed Motivo methods without model calls
        shell: bash
        run: python motivo/tests/run.py --tactus "$CARGO_TARGET_DIR/debug/tactus" --installed-only
      - name: Type-check the model-free active-window persistent task
        run: >-
          cabal exec --builddir=Build/cabal -- ghc -fno-code -package clef-sdk -package segno-flow
          segno-flow/examples/active-window/900_record_active_window.hs
      - name: Exercise Segno through Tactus package resolution
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/segno-package-e2e"
          script="$smoke/.tactus/scripts/900_record_active_window.hs"
          manifest="$smoke/task-manifest.json"
          segno_bin="$(cabal list-bin --builddir=Build/cabal segno-flow:exe:segno)"
          tactus init "$smoke" --sdk "$GITHUB_WORKSPACE/clef-sdk"
          "$segno_bin" init --root "$smoke" --sdk "$GITHUB_WORKSPACE/segno-flow"
          cp segno-flow/examples/active-window/900_record_active_window.hs "$script"
          tactus check --root "$smoke" --package segno-flow "$script"
          SEGNO_MODE=describe SEGNO_RESULT_PATH="$manifest" \
            tactus run --root "$smoke" --package segno-flow --script "$script"
          python -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert value["api"] == "agenstro.segno.task/v1"' "$manifest"
      - name: Exercise Haskell through the typed Rust dispatcher
        run: >-
          cargo +stable test --locked -p tactus-runtime --test runtime
          haskell_generic_plugin_routes_through_absolute_tactus_dispatch
          -- --ignored --exact
      - name: Run the offline multi-step topology acceptance
        run: >-
          cargo +stable test --locked -p tactus-runtime --test runtime
          haskell_topology_workflow_runs_all_stages_with_parallel_reviews
          -- --ignored --exact
      - name: Validate the Clef source distribution
        shell: bash
        run: |
          cd clef-sdk
          cabal check
          cabal sdist --builddir=Build/cabal
      - name: Validate the Segno source distribution
        shell: bash
        run: |
          cd segno-flow
          cabal check
          cabal sdist --builddir=Build/cabal
      - name: Run the real Tactus-to-GHC path
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/tactus-e2e"
          tactus init "$smoke" --sdk "$GITHUB_WORKSPACE/clef-sdk"
          mkdir -p "$smoke/.tactus/scripts"
          printf '%s\n' 'import Clef' 'main :: IO ()' 'main = runTactus (liftIO (putStrLn "TACTUS_CI_OK"))' > "$smoke/.tactus/scripts/010_ci.hs"
          tactus list --root "$smoke" --json
          tactus doctor --root "$smoke" --json
          tactus check --root "$smoke" --all
          tactus run --root "$smoke" --all | grep -F TACTUS_CI_OK
      - name: Type-check the multi-step topology workflows
        shell: bash
        run: |
          for script in examples/topology-holes/workflow/*.hs; do
            cabal exec --builddir=Build/cabal -- ghc -fno-code -package clef-sdk "$script"
          done
      - name: Type-check Clef documentation examples
        if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.14.1'
        shell: pwsh
        run: ./Test/repository/test-clef-documentation-examples.ps1
      - name: Remove Rust build artifacts
        if: always()
        run: cargo clean --target-dir "${{ env.CARGO_TARGET_DIR }}"

  docs:
    name: Strict documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify the language-neutral norm checker
        run: python plugins/latex-norm-check/run_fixtures.py
      - name: Build documentation
        run: |
          python -m pip install "mkdocs>=1.6,<2"
          python -m mkdocs build --strict --site-dir "${{ runner.temp }}/agenstro-site"
      - name: Validate documentation contracts
        shell: pwsh
        run: ./Test/repository/test-documentation-contract.ps1

  motivo-isolation:
    name: Motivo real Linux isolation (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.88.0"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow Bubblewrap user namespaces on the test runner
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # Scope the permission to Bubblewrap on this disposable runner.
          sudo tee /etc/apparmor.d/motivo-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile motivo-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/motivo-ci-bwrap
          /usr/bin/bwrap --unshare-all --unshare-user --disable-userns --cap-drop ALL \
            --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Test the real experiment boundary
        run: cargo +${{ matrix.rust }} test -p motivo-test --locked

  motivo-studio:
    name: Motivo Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: motivo-studio
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: motivo-studio/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test without model calls
        run: npm test
      - name: Package the standalone HTML template
        run: npm run package

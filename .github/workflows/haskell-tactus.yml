name: Haskell and Tactus 0.3

on:
  pull_request:
    paths:
      - ".github/workflows/haskell-tactus.yml"
      - "cabal.project"
      - "clef-sdk/clef-sdk.cabal"
      - "clef-sdk/haskell/**"
      - "clef-sdk/README.md"
      - "clef-sdk/MIGRATION.md"
      - "tactus-runtime/pyproject.toml"
      - "tactus-runtime/.gitignore"
      - "tactus-runtime/src/tactus_runtime/**"
      - "tactus-runtime/tests/**"
      - "tactus-runtime/README.md"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
  push:
    paths:
      - ".github/workflows/haskell-tactus.yml"
      - "cabal.project"
      - "clef-sdk/clef-sdk.cabal"
      - "clef-sdk/haskell/**"
      - "clef-sdk/README.md"
      - "clef-sdk/MIGRATION.md"
      - "tactus-runtime/pyproject.toml"
      - "tactus-runtime/.gitignore"
      - "tactus-runtime/src/tactus_runtime/**"
      - "tactus-runtime/tests/**"
      - "tactus-runtime/README.md"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: read

jobs:
  clef-haskell:
    name: Clef Haskell (${{ matrix.os }}, GHC ${{ matrix.ghc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: "9.10.3"
            cabal: "3.16.1.0"
          - os: windows-latest
            ghc: "9.10.3"
            cabal: "3.16.1.0"
          - os: ubuntu-latest
            ghc: "9.14.1"
            cabal: "3.18.1.0"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@bda9c527d4136f7759733016190c34a24c84f4f4 # v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tactus-runtime/pyproject.toml
      - name: Install Tactus
        run: python -m pip install ./tactus-runtime
      - name: Build Clef
        run: cabal build all
      - name: Test Clef with fake plugins
        run: cabal test all --test-show-details=direct
      - name: Validate the Clef source distribution
        run: |
          cd clef-sdk
          cabal check
          cabal sdist
      - name: Run the real Tactus to GHC path
        shell: bash
        run: |
          tactus init --root "$RUNNER_TEMP/tactus-e2e" --sdk "$GITHUB_WORKSPACE/clef-sdk"
          python -c "from pathlib import Path; import os; path=Path(os.environ['RUNNER_TEMP'])/'tactus-e2e'/'.tactus'/'scripts'/'010_ci.hs'; path.write_text('import Clef\nmain :: IO ()\nmain = runTactus (liftIO (putStrLn \"TACTUS_CI_OK\"))\n', encoding='utf-8')"
          tactus check --root "$RUNNER_TEMP/tactus-e2e"
          tactus run --root "$RUNNER_TEMP/tactus-e2e" | grep -F TACTUS_CI_OK

  tactus-python:
    name: Tactus Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tactus-runtime/pyproject.toml
      - name: Install Tactus and test tools
        run: python -m pip install -e "./tactus-runtime[dev]"
      # Provider CLIs are deliberately not installed. The suite uses fake
      # executors, including for live-smoke argv and output parsing.
      - name: Run Tactus tests without model calls
        run: python -m pytest tactus-runtime/tests
      - name: Lint Tactus
        run: python -m ruff check tactus-runtime/src/tactus_runtime tactus-runtime/tests
      - name: Check Tactus formatting
        run: python -m ruff format --check tactus-runtime/src/tactus_runtime tactus-runtime/tests
      - name: Type-check Tactus
        run: python -m pyright -p tactus-runtime/pyproject.toml
      - name: Build and inspect isolated Tactus artifacts
        run: |
          python -m build --outdir "${{ runner.temp }}/tactus-dist" tactus-runtime
          python -c "from pathlib import Path; import tarfile,zipfile; root=Path(r'${{ runner.temp }}/tactus-dist'); tar=next(root.glob('*.tar.gz')); wheel=next(root.glob('*.whl')); names=tarfile.open(tar).getnames()+zipfile.ZipFile(wheel).namelist(); forbidden=('/archive/','/rust/','/rewrite-report/','/runtime-check/','/client.py','/jupyter_bridge.py','/jupyter_worker.py','/protocol.py','/script_file.py','/studio.py','/worker.py','/_motivo_ui/'); assert not any(any(part in '/' + name for part in forbidden) for name in names), names"
          python -c "from pathlib import Path; import subprocess,sys; wheel=next(Path(r'${{ runner.temp }}/tactus-dist').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)])"
          python -c "from importlib.util import find_spec; import tactus_runtime; frozen=('client','jupyter_bridge','jupyter_worker','protocol','script_file','studio','worker','_motivo_ui'); assert all(find_spec('tactus_runtime.'+name) is None for name in frozen)"
          tactus --version
          tactus-provider-host --help
          tactus-effect-host --help

  docs:
    name: Strict documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build documentation
        run: |
          python -m pip install "mkdocs>=1.6,<2"
          python -m mkdocs build --strict --site-dir "${{ runner.temp }}/agenstro-site"
